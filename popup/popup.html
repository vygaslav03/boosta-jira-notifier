<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boosta Jira Notifier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container" id="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" width="24" height="24" fill="none">
          <rect width="32" height="32" rx="8" fill="url(#boosta-grad)"/>
          <path d="M9 22V10h7.5c2.5 0 4.5 1.2 4.5 3.2 0 1.4-.8 2.4-2 2.8 1.5.4 2.5 1.6 2.5 3.2 0 2.2-2 2.8-5 2.8H9zm4-7h3c1 0 1.8-.5 1.8-1.3S17 12.4 16 12.4h-3V15zm0 5h3.5c1.2 0 2-.5 2-1.4 0-.9-.8-1.4-2-1.4H13V20z" fill="#FFFFFF"/>
          <defs>
            <linearGradient id="boosta-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#EA1C2C"/>
              <stop offset="1" stop-color="#FF4D5E"/>
            </linearGradient>
          </defs>
        </svg>
        <h1 class="brand-title">Boosta Jira</h1>
      </div>
      <div class="status-badge disconnected" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Checking...</span>
      </div>
    </header>

    <!-- Top Action Toolbar -->
    <section class="toolbar">
      <div class="sync-info">
        <span class="label">Last sync:</span>
        <span class="value" id="lastSyncTime">Never</span>
      </div>
      <div class="toolbar-actions">
        <button id="btnSync" class="btn btn-secondary" title="Sync now">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
          </svg>
          <span>Sync</span>
        </button>
        <button id="btnOpenJira" class="btn btn-secondary" title="Open Boosta Jira">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Jira</span>
        </button>
        <button id="btnDnd" class="btn btn-icon-only" title="Focus Mode (Do Not Disturb)">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
          </svg>
        </button>
        <button id="btnSettings" class="btn btn-icon-only" title="Settings">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- DND Active Banner -->
    <div class="dnd-banner" id="dndBanner" style="display: none;">
      <span class="dnd-icon">🌙</span>
      <span class="dnd-text" id="dndText">Do Not Disturb Active</span>
      <button class="btn-text dnd-off-btn" id="btnDisableDnd">Disable</button>
    </div>

    <!-- Navigation Tabs -->
    <nav class="tab-bar" id="tabBar">
      <button class="tab-btn active" data-tab="notifications">
        <span>🔔 Уведомления</span>
        <span class="badge" id="unreadBadge">0</span>
      </button>
      <button class="tab-btn" data-tab="assigned">
        <span>📋 Мои задачи</span>
      </button>
      <button class="tab-btn" data-tab="watched">
        <span>👁 Наблюдаемые</span>
      </button>
      <button class="tab-btn" data-tab="review">
        <span>🚨 На ревью</span>
      </button>
    </nav>

    <!-- Main Notification & Issues List Container -->
    <main class="notifications-section">
      <div class="section-header">
        <h2 class="section-title">Recent Notifications</h2>
        <span class="badge" id="unreadBadge">0</span>
      </div>

      <div class="notification-list" id="notificationList">
        <!-- Renders list items dynamically -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button id="btnClearHistory" class="btn-text">Clear History</button>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
